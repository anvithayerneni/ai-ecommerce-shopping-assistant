name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ai_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecommerce -d ai_ecommerce_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@localhost:5432/ai_ecommerce_test
          DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@localhost:5432/ai_ecommerce_test
          AZURE_SEARCH_ENDPOINT: https://test-search.example.com
          AZURE_SEARCH_API_KEY: test-api-key
          AZURE_SEARCH_INDEX_NAME: test-index
        run: |
          pytest -q